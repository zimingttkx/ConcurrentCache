name: C++ CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# PR 分支上取消被取代的旧运行；main 上不取消 —— 连续合并时，前一次运行是唯一
# 对已进 main 的代码的验证，取消它会留下没人验过的窗口（实测发生过：d69fd05
# 的运行被 454f038 挤成 cancelled）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 每个 job 自己 configure + build（Redis 的 ci.yml 也是这个形状）：用
  # artifact 传十几个测试二进制比重编更脆，墙钟时间差别不大。
  #
  # job 名一律显式写死且不用 matrix：这些名字之后要逐个填进分支保护的
  # required status checks，matrix 会自动追加 " (…)" 后缀导致对不上、PR 永久 pending。

  build:
    name: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zlib1g-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: concurrentcache-binary
          path: build/concurrentcache-server
          retention-days: 1

  # 代码里有 70+ 处 assert（storage.cpp、expire_dict.cpp、cluster_state.cpp 等）。
  # 只在 Release 下构建等于这些契约从未被执行过 —— Redis 也专门留一条
  # -DDEBUG_ASSERTIONS 的路。本 job 目前只编译不跑测试：Debug 首日很可能被
  # 既有 assert 直接 SIGABRT（assert 不会被 TestSuite 的 try/catch 接住，会带走
  # 整个二进制），先把它编译出来看真实状态，再决定何时挂测试。
  assert:
    name: build-assert
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zlib1g-dev

      - name: Configure and build (asserts live)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build --parallel "$(nproc)"

  gate:
    name: gate-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zlib1g-dev

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          # 构建全部 target，不要退回"只列几个测试二进制"。
          #
          # 这里以前写死 `--target atomic-tests sync-primitives-tests cluster-tests`，
          # 而用例归属哪个层是 test/CMakeLists.txt 里的 CC_TESTS 注册表决定的：把
          # V3Tests / Lock* 从 contract 收紧到 gate 之后，这个 job 根本没有编译它们，
          # ctest -L gate 就报 "***Not Run"、退出码 8（#41 第一次跑就是这样红的）。
          # 一份知识不能有两处真相：labels 是唯一事实来源，构建步骤跟着它走。
          cmake --build build --parallel "$(nproc)"

      # -j1：rdb_test 用固定的 /tmp/test_rdb_*.rdb，且 GlobalStorage /
      # RdbPersistence / ClusterServer 都是单例，并行必互踩。
      - name: Run gate tests
        run: ctest --test-dir build -L gate --output-on-failure -j1

  # 不拦合并：这一层跑"结果还没人知道"或"断言正确语义而产品尚不满足"的用例。
  # 拦不拦由分支保护规则决定（这个 job 不在 required 列表里），不靠 workflow 里
  # 写 continue-on-error —— 那样 check 名永远显示 pass，这一层唯一的存在意义（把红
  # 显示出来）就没了。#19 那轮 ctest 退出码 8、3 个用例失败，check 却报 pass。
  # pipefail 保证 ctest 的失败不被 tee 吞掉。
  contract:
    name: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zlib1g-dev

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel "$(nproc)"

      - name: Run contract tests
        run: |
          set -o pipefail
          ctest --test-dir build -L contract --output-on-failure -j1 | tee contract.log

      - name: Summarize
        if: always()
        run: |
          {
            echo "### contract 层（可见不拦）"
            grep -E "tests passed|tests failed" contract.log || echo "见上方日志"
            echo
            echo "某项连续绿之后，把 test/CMakeLists.txt 注册表里它的标签改成 gate 即完成收紧。"
          } >> "$GITHUB_STEP_SUMMARY"

  # 三张表 + 测试文件清单 + 配置口径 + 端口一致性。注册表由 command-table-probe
  # 在运行时回答，脚本不信任自己对 C++ 源码的正则。
  consistency:
    name: consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zlib1g-dev python3

      - name: Build the probe
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --target command-table-probe --parallel "$(nproc)"

      - name: Check tables, inventory and ports
        run: python3 scripts/ci/check_consistency.py build/test/command-table-probe

  asan:
    name: asan-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # detect_leaks 本轮关掉：thread_local ThreadCache、mmap span、rdb.cpp:333 的
      # detached 快照线程都会报泄漏，那是缺陷队列而不是回归信号。泄漏单独跑
      # daily 的 asan-leaks（不拦合并）。
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1:exitcode=99:detect_stack_use_after_return=0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zlib1g-dev

      - name: Configure and build (ASan)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DBUILD_TESTING=ON
          cmake --build build --parallel "$(nproc)"

      # 这一步是拦合并的：ASAN 下的编译/链接必须干净。
      - name: ASan build summary
        run: |
          {
            echo "### asan-smoke"
            echo "构建配置：Debug + -fsanitize=address，全部测试 target 编译链接通过。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 运行阶段暂时只观察不拦：这是 gate 第一次在 Debug 下跑，而 assert() 只在
      # Debug 生效且 SIGABRT 不会被 TestSuite 的 try/catch 接住（整个二进制直接没）。
      # 攒够连续干净结果后，把 continue-on-error 去掉即完成收紧。
      - name: ASan sweep (observe)
        continue-on-error: true
        run: |
          set -o pipefail
          ctest --test-dir build -L "gate|contract" -j1 --output-on-failure 2>&1 | tee asan.log
          {
            echo
            echo "### ASAN 运行结果（不拦合并）"
            grep -E "tests passed|tests failed" asan.log || echo "见上方日志"
          } >> "$GITHUB_STEP_SUMMARY"

  # .dockerignore 排除了 test/，而 add_subdirectory(test) 曾是无条件的，
  # 导致 docker build 在 configure 阶段失败。这个 job 就是那条回归的哨兵。
  docker:
    name: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t concurrentcache:ci .

      - name: Inspect image
        run: docker images concurrentcache:ci
