port = 6379
log_level = 4
rdb_save_interval = 0
cluster_enabled = false
max_entries = 2000000

# 每条连接的缓冲高水位，单位是字节。对应 Redis 的
# client-query-buffer-limit / client-output-buffer-limit。
# 0 = 不限制；小于 1MB 的值会被抬到 1MB。
# 输入方向决定了一条连接最多能攒多大的未完成请求（也就是可用的最大 value），
# 输出方向决定了对端不读时最多能积压多少回复。
client_query_buffer_limit = 16777216
client_output_buffer_limit = 67108864
